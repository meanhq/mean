name: Release

# One dispatch, one version. Pick the bump, the workflow runs the full
# check, bumps @meanhq/mean, tags, publishes to npm with provenance and
# writes a GitHub release with generated notes. The bump is committed
# only after the check passes, so a failed run burns nothing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        options: [latest, next]
        default: latest

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

      - name: Bump version
        id: bump
        run: |
          cd packages/mean
          VERSION=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/mean/package.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          # A lightweight tag is not carried by --follow-tags; name it.
          git push origin HEAD:main "refs/tags/${{ steps.bump.outputs.tag }}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm build
          cd packages/mean
          npm publish --access public --provenance --tag "${{ inputs.tag }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            $([ "${{ inputs.tag }}" = "next" ] && echo --prerelease)
